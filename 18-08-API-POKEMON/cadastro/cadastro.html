<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cadastro.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Cadastro de trinadores</title>
</head>
<body>
<div class="cadastro">
    <div class="titulo">
       <h1>Tela de Cadastro</h1>
    </div>
<br>
<h3>Coloque seu nome completo aqui</h3>
<input type="text" class="nome_treinador" placeholder="Digite o seu nome">
<br>
<br>
<h3>Coloque seu e-mail </h3>
<input type="email" id="e_mail" class="email" placeholder="Digite aqui seu email ">
<br>
<br>
<h3>crie sua senha aqui</h3>
<input type="password" class="senha" placeholder="Digite sua senha aqui">
<br>
<br>
<h3>Confirme aqui sua senha</h3>
<input type="password_confirmed" class="senha" placeholder="Confirme sua senha">
<br>
<br>
<h3>Data de nascimento</h3>
<input type="date" name="" id="">
<br>
<br>
<button type="button" class="btn btn-danger">Danger</button>
</div>


</body>
</html>
