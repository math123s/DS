<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador Pokémon Completo</title>
<link rel="stylesheet" href="style.css">
<script src="pokemon.js"></script>
<script src="main.js"></script>
</head>
<body>

<h1>Simulador Pokémon</h1>

<!-- Cadastro Treinador -->
<div class="panel">
<h2>Cadastrar Treinador</h2>
<label>Nome:</label><input type="text" id="nomeTreinador">
<label>Idade:</label><input type="number" id="idadeTreinador">
<label>Cidade:</label><input type="text" id="cidadeTreinador">
<button onclick="cadastrarTreinador()">Cadastrar</button>
</div>

<!-- Lista Treinadores -->
<div class="panel">
<h2>Treinadores Cadastrados</h2>
<div id="listaTreinadores"></div>
</div>

<!-- Seleção de Pokémons -->
<div class="panel">
<h2>Selecionar Pokémons para Batalha</h2>
<div>
<label>Treinador 1:</label>
<select id="treinador1"></select>
<input type="text" id="pokemon1" placeholder="Nome Pokémon 1">
<button onclick="selecionarPokemon1()">Selecionar</button>
<br>
<label>Treinador 2:</label>
<select id="treinador2"></select>
<input type="text" id="pokemon2" placeholder="Nome Pokémon 2">
<button onclick="selecionarPokemon2()">Selecionar</button>
</div>

<!-- Exibição de Pokémons e barras de vida -->
<div class="flex-container">
    <div>
        <img id="sprite1" class="pokemon-img">
        <div class="progress-bar"><div id="vida1" class="progress-fill"></div></div>
    </div>
    <div>
        <img id="sprite2" class="pokemon-img">
        <div class="progress-bar"><div id="vida2" class="progress-fill"></div></div>
    </div>
</div>

<div>
<button onclick="iniciarBatalha()">Iniciar Batalha</button>
<button onclick="resetarBatalha()">Resetar</button>
</div>

<h3>Log da Batalha</h3>
<div id="logBatalha"></div>
<div id="vencedor"></div>

<h3>Histórico de Batalhas</h3>
<div id="historicoBatalhas"></div>

<script src="script.js"></script>
</body>
</html>
